name: Build Character Pack

on:
  push:
    paths:
      - "tools/generate_characters.py"
      - ".github/workflows/build-character-pack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-character-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned model-generation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "trimesh==4.11.1"

      - name: Generate and validate character pack
        run: python tools/generate_characters.py

      - name: Commit generated GLB candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/v0.1.0
          if git diff --cached --quiet; then
            echo "Character assets already match generator output."
          else
            git commit -m "Generate character pack v0.1.0 candidate"
            git push
          fi
